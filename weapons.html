<h1>Weapons</h1>
<div class="notice"><b>What is this?</b> Every gun, blade, and bow — with stats and where to farm them.</div>
<p class="muted small" id="w-count"></p>
<p class="muted">Guns and blades. <b>Primary</b> = main gun, <b>Secondary</b> = sidearm, <b>Melee</b> = close-range. Higher crit + status = stronger with the right mods.</p>
<div class="chip-row" id="w-tabs">
  <button class="chip active" data-t="Primary">Primary</button>
  <button class="chip" data-t="Secondary">Secondary</button>
  <button class="chip" data-t="Shotgun">Shotgun</button>
  <button class="chip" data-t="Melee">Melee</button>
  <button class="chip" data-t="Archgun">Archgun</button>
  <button class="chip" data-t="Archmelee">Archmelee</button>
</div>

<script>document.addEventListener("DOMContentLoaded",function(){var l=document.getElementById("w-list");if(l&&window.TV&&window.TV.skeletonCards)window.TV.showLoader(l);});</script>

<script>
(function () {
  var esc = window.TV.esc, all = [], type = 'Primary', ctl = null;
  function thumb(item, size) {
    if (!item.img) return '';
    return '<img src="' + item.img + '" alt="" loading="lazy" width="' + size + '" height="' + size + '"' +
      ' style="width:' + size + 'px;height:' + size + 'px;object-fit:contain;flex-shrink:0;border-radius:8px;background:rgba(255,255,255,0.04);"' +
      ' onerror="this.style.display=\'none\'">';
  }
  function card(w) {
    var a = document.createElement('a');
    a.className = 'list-item'; a.href = '#' + encodeURIComponent(w.name);
    a.innerHTML = '<div style="display:flex;gap:12px;align-items:center;">' + thumb(w, 64) +
      '<div><h3>' + esc(w.name) + ' <span class="badge type">MR' + w.masteryReq + '</span></h3>' +
      '<div class="stat-row"><span class="stat">Dmg <b>' + w.totalDamage + '</b></span>' +
      '<span class="stat">Crit <b>' + w.criticalChance + '%</b></span>' +
      '<span class="stat">Status <b>' + w.statusChance + '%</b></span>' +
      (w.fireRate ? '<span class="stat">Rate <b>' + w.fireRate + '</b></span>' : '') + '</div></div></div>';
    return a;
  }
  function filtered() {
    var q = document.getElementById('w-q').value.toLowerCase();
    return all.filter(function (w) {
      var ok = type === 'Shotgun' ? w.category === 'Shotgun' : w.type === type;
      return ok && w.name.toLowerCase().indexOf(q) !== -1;
    });
  }
  function showDetail(name) {
    var box = document.getElementById('w-detail');
    var w = all.find(function (x) { return x.name === name; });
    if (!w) { box.innerHTML = ''; return; }
    box.innerHTML = '<div class="detail-box"><div class="detail-head">' +
      (w.img ? '<img src="' + w.img + '" alt="' + esc(w.name) + '" loading="lazy" onerror="this.style.display=\'none\'">' : '') +
      '<div><h2>' + esc(w.name) + ' <span class="badge type">' + esc(w.type) + '</span>' + (w.category ? ' <span class="badge type">' + esc(w.category) + '</span>' : '') + '</h2>' +
      '<p>' + esc(w.description || 'No description available.') + '</p></div></div>' +
      '<div class="stat-row">' +
      '<span class="stat">Total damage <b>' + w.totalDamage + '</b></span>' +
      /* v2.12.57: shotguns show per-shot damage across all pellets — the card
         damage is per pellet, which understated shotguns (e.g. MK1-Strun:
         18 per pellet × 10 pellets = 180 per shot). Scoped to Shotgun
         category only: other multishot weapons (bows, Twin Grakatas) fire
         arrows/bolts, not pellets, so the label would mislead there. */
      (w.category === 'Shotgun' && w.multishot && w.multishot > 1 ? '<span class="stat">Pellets <b>' + w.multishot + '</b></span>' +
      '<span class="stat">Damage per shot (all pellets) <b>' + (Math.round(w.totalDamage * w.multishot * 100) / 100) + '</b></span>' : '') +
      '<span class="stat">Crit chance <b>' + w.criticalChance + '%</b></span>' +
      '<span class="stat">Crit damage <b>' + w.criticalMultiplier + 'x</b></span>' +
      '<span class="stat">Status <b>' + w.statusChance + '%</b></span>' +
      (w.fireRate ? '<span class="stat">Fire rate <b>' + w.fireRate + '</b></span>' : '') +
      (w.magazine ? '<span class="stat">Mag <b>' + w.magazine + '</b></span>' : '') +
      '<span class="stat">Mastery <b>' + w.masteryReq + '</b></span>' +
      (w.trigger ? '<span class="stat">Trigger <b>' + esc(w.trigger) + '</b></span>' : '') + '</div>' +
      '<div class="farm-box"><h4>📍 Where to farm</h4><p>' +
      esc(w.farm || 'Check the in-game Codex or Market for the latest source.') + '</p><p style="margin-top:8px"><a class="btn small" href="starchart.html?item=' + encodeURIComponent(w.name) + '">🗺️ Star Chart</a></p></div></div>';
    box.scrollIntoView();
    document.getElementById('related').innerHTML = window.TV.relatedLinks('Keep going', [
      { label: 'Builds for ' + w.type + ' weapons', sub: 'Steel Path & one-shot setups', url: 'builds.html' },
      { label: 'Best mods', sub: 'What to put on it', url: 'mods.html' },
      { label: 'Platinum price', sub: 'If it has prime parts', url: 'live.html#prices' }
    ]);
  }
  window.TV.getJSONParts('data/site/weapons', 3).then(function (d) {
    all = d;
    document.getElementById('w-count').textContent = d.length + ' Weapons';
    var list = document.getElementById('w-list');
    ctl = window.TV.infiniteScroll(list, filtered(), card, 30);
    function refresh() { ctl.reset(filtered()); }
    document.getElementById('w-q').addEventListener('input', refresh);
    document.getElementById('w-tabs').addEventListener('click', function (e) {
      var b = e.target.closest('.chip'); if (!b) return;
      document.querySelectorAll('#w-tabs .chip').forEach(function (c) { c.classList.remove('active'); });
      b.classList.add('active'); type = b.getAttribute('data-t');
      document.getElementById('w-detail').innerHTML = '';
      history.replaceState(null, '', ' ');
      refresh();
    });
    if (location.hash.length > 1) {
      var w = all.find(function (x) { return x.name === decodeURIComponent(location.hash.slice(1)); });
      if (w) {
        type = w.type;
        document.querySelectorAll('#w-tabs .chip').forEach(function (c) {
          c.classList.toggle('active', c.getAttribute('data-t') === type);
        });
        ctl.reset(filtered());
        showDetail(w.name);
      }
    }
    window.addEventListener('hashchange', function () {
      showDetail(decodeURIComponent(location.hash.slice(1)));
    });
  }).catch(function () {
    document.getElementById('w-list').innerHTML = '<div class="notice">Couldn\'t load the data &mdash; this is usually a stale cache. <button class="btn small" onclick="window.TV.hardReload()">Tap to retry</button></div>';
  });
})();
