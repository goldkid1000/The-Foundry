/* ---- Star Chart page styles ---- */
.sc-wrap { position: relative; }
.sc-map { width: 100%; height: auto; max-height: 70vh; background: #04060d; border-radius: 12px; border: 1px solid rgba(0,229,255,.15); touch-action: pan-x pan-y; }
.sc-orbit { fill: none; stroke: rgba(0,229,255,.07); stroke-width: 1; }
.sc-star { fill: #fff; opacity: .5; }
.sc-sun { filter: drop-shadow(0 0 24px rgba(255,180,80,.9)); }
.sc-body { cursor: pointer; }
.sc-body circle.core { transition: filter .25s ease; }
.sc-body:hover circle.core, .sc-body:focus circle.core { filter: drop-shadow(0 0 10px currentColor); }
.sc-label { fill: #b0c4de; font-size: 13px; text-anchor: middle; pointer-events: none; font-family: inherit; }
.sc-body:hover .sc-label { fill: #fff; }
.sc-halo { fill: none; stroke: currentColor; stroke-width: 2; opacity: 0; pointer-events: none;
  transform-box: fill-box; transform-origin: center; }
.sc-body.target .sc-halo { opacity: .9; animation: sc-pulse 2s ease-in-out infinite; }
@keyframes sc-pulse { 0%,100% { transform: scale(1); opacity: .9; } 50% { transform: scale(1.35); opacity: .3; } }
.sc-drift { animation: sc-drift 14s ease-in-out infinite alternate; }
@keyframes sc-drift { from { transform: translate(0,0); } to { transform: translate(0,-7px); } }
.sc-zone-label { fill: #8a9bb5; font-size: 11px; text-anchor: middle; pointer-events: none; }
.sc-tip { position: absolute; pointer-events: none; background: rgba(10,18,32,.95); border: 1px solid rgba(0,229,255,.4);
  border-radius: 8px; padding: 6px 10px; font-size: 13px; color: #fff; z-index: 5; display: none; white-space: nowrap; }
.sc-panel { margin-top: 12px; }
.sc-legend { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0; }
.sc-legend .badge { cursor: pointer; }
/* mobile fit: 44px tap targets for legend filter badges */
@media (max-width:600px){
  .sc-legend .badge{min-height:44px;display:inline-flex;align-items:center}
}
#sc-camera { transition: transform 1.1s cubic-bezier(.22,.8,.3,1); transform-origin: 0 0; }
.sc-controls { display: flex; gap: 8px; margin: 10px 0; flex-wrap: wrap; }
/* ---- item farm search ---- */
.sc-item-search { position: relative; margin: 10px 0; }
#sc-item-input {
  width: 100%; padding: 12px 16px; font-size: 16px; border-radius: 12px;
  background: rgba(10,18,32,.8); border: 1px solid rgba(0,229,255,.3); color: #fff;
}
#sc-item-input:focus { outline: none; border-color: #00e5ff; box-shadow: 0 0 0 2px rgba(0,229,255,.2); }
#sc-item-input::placeholder { color: #5a6a85; }
.sc-item-results {
  position: absolute; top: 100%; left: 0; right: 0; z-index: 20; max-height: 280px; overflow-y: auto;
  background: rgba(13,27,42,.98); border: 1px solid rgba(0,229,255,.35); border-radius: 12px; margin-top: 4px;
}
.sc-item-result { padding: 10px 14px; cursor: pointer; border-bottom: 1px solid rgba(0,229,255,.08); }
.sc-item-result:last-child { border-bottom: none; }
.sc-item-result:hover, .sc-item-result:active { background: rgba(0,229,255,.1); }
.sc-item-result b { color: #fff; display: block; }
.sc-item-result span { color: #8a9bb5; font-size: 13px; }
.sc-item-result .sc-zones { color: #00e5ff; font-size: 12px; margin-top: 2px; display: block; }
/* ---- detail overlay: bottom sheet on mobile, side panel on desktop ---- */
#sc-overlay { position: absolute; inset: 0; z-index: 10; pointer-events: none; opacity: 0; transition: opacity .3s ease; }
#sc-overlay.show { opacity: 1; pointer-events: auto; }
.sc-overlay-backdrop { position: absolute; inset: 0; background: rgba(2,4,10,.55); }
.sc-overlay-card {
  position: absolute; left: 12px; right: 12px; bottom: 12px; max-height: 55%;
  overflow-y: auto; background: linear-gradient(135deg, #0d1b2a 0%, #16283f 100%);
  border: 1px solid rgba(0,229,255,.35); border-radius: 16px; padding: 18px;
  box-shadow: 0 8px 40px rgba(0,229,255,.25);
  transform: translateY(24px); transition: transform .35s cubic-bezier(.22,.8,.3,1);
}
#sc-overlay.show .sc-overlay-card { transform: translateY(0); }
@media (min-width: 1024px) {
  .sc-overlay-card { left: auto; right: 16px; top: 16px; bottom: 16px; width: 340px; max-height: none; }
}
.sc-detail-card h2 { margin: 0 0 4px; font-size: 1.4rem; }
.sc-detail-card h3 { margin: 14px 0 8px; font-size: 1rem; color: #00e5ff; }
.sc-detail-close {
  position: absolute; top: 10px; right: 12px; background: none; border: none;
  color: #8a9bb5; font-size: 18px; cursor: pointer; padding: 6px; min-width: 44px; min-height: 44px;
}
.sc-farm-list { display: flex; flex-direction: column; gap: 6px; }
.sc-farm-row {
  background: rgba(0,229,255,.06); border: 1px solid rgba(0,229,255,.12);
  border-radius: 8px; padding: 8px 12px; display: flex; flex-direction: column; gap: 2px;
}
.sc-farm-row b { color: #fff; font-size: 14px; }
.sc-farm-row span { color: #8a9bb5; font-size: 12px; }
@media (prefers-reduced-motion: reduce) {
  .sc-drift, .sc-body.target .sc-halo { animation: none; }
  #sc-camera { transition: none; }
  #sc-overlay, .sc-overlay-card { transition: none; }
}
</style>
</head>

<h1>Star Chart</h1>
<div class="notice"><b>What is this?</b> The Warframe solar system. Tap any planet or zone to see what drops there. Opened from an item? The map flies straight to where it farms.</div>
<div class="sc-controls">
  <button class="btn small" id="sc-reset">⟲ Reset view</button>

</div>
<div class="sc-wrap">

        <stop offset="0%" stop-color="#fff3d0"/><stop offset="55%" stop-color="#ffbe5a"/><stop offset="100%" stop-color="#ff8a3a" stop-opacity="0"/>
      </radialGradient>

    <g id="sc-camera">
      <g id="sc-stars"></g>
      <g id="sc-orbits"></g>
      <g id="sc-sun-layer"></g>
      <g id="sc-bodies"></g>
      <text x="600" y="600" class="sc-zone-label" id="sc-special-label" style="font-size:14px;letter-spacing:3px;fill:#5a6b85">— SPECIAL ZONES —</text>
    </g>
  </svg>
  <div class="sc-tip" id="sc-tip"></div>
</div>
<div class="sc-panel" id="sc-panel"><p class="muted">Select a planet or zone to see what farms there.</p></div>
<div id="related"></div>
</main>

<script src="js/holidays.js?v=2.24.4"></script>
<script src="js/firebase-config.js?v=2.24.4"></script>
<script src="js/chat.js?v=2.24.4"></script>
<script src="js/chat-panel.js?v=2.24.4"></script>
<script src="js/update-notify.js?v=2.24.4"></script>
<script src="js/whats-new.js?v=2.24.4"></script>
<script>
(function () {
  'use strict';
  var esc = window.TV.esc;
  var svg = document.getElementById('sc-svg');
  var camera = document.getElementById('sc-camera');
  var bodiesG = document.getElementById('sc-bodies');
  var tip = document.getElementById('sc-tip');
  var panel = document.getElementById('sc-panel');
  var chart = null, itemPlanets = null, zoneItems = {};
  var NS = 'http://www.w3.org/2000/svg';
  var reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function el(tag, attrs, parent) {
    var e = document.createElementNS(NS, tag);
    for (var k in attrs) e.setAttribute(k, attrs[k]);
    if (parent) parent.appendChild(e);
    return e;
  }

  /* stars */
  (function stars() {
    var g = document.getElementById('sc-stars'), seed = 42;
    function rnd() { seed = (seed * 1103515245 + 12345) & 0x7fffffff; return seed / 0x7fffffff; }
    for (var i = 0; i < 160; i++) {
      var c = el('circle', { cx: (rnd() * 1200).toFixed(0), cy: (rnd() * 800).toFixed(0),
        r: (rnd() * 1.4 + 0.3).toFixed(1), 'class': 'sc-star' }, g);
      c.style.opacity = (rnd() * 0.5 + 0.15).toFixed(2);
    }
  })();

  function params() {
    var m = {};
    location.search.slice(1).split('&').forEach(function (p) {
      var kv = p.split('=');
      if (kv[0]) m[decodeURIComponent(kv[0])] = decodeURIComponent(kv[1] || '');
    });
    return m;
  }

  function buildChart() {
    var bodies = chart.planets.concat(chart.zones);
    /* orbits for planets */
    var og = document.getElementById('sc-orbits');
    chart.planets.forEach(function (p, i) {
      var rx = Math.abs(p.x - 120) + 30, ry = 120 + (i % 3) * 22;
      el('ellipse', { cx: 120, cy: 400, rx: rx, ry: Math.min(ry, 330), 'class': 'sc-orbit' }, og);
    });
    /* sun */
    var sg = document.getElementById('sc-sun-layer');
    el('circle', { cx: 120, cy: 400, r: 52, fill: 'url(#sc-sun-g)', 'class': 'sc-sun' }, sg);
    el('circle', { cx: 120, cy: 400, r: 30, fill: '#ffbe5a' }, sg);
    var sl = el('text', { x: 120, y: 470, 'class': 'sc-label' }, sg);
    sl.textContent = 'Sun';

    bodies.forEach(function (b, i) {
      var g = el('g', { 'class': 'sc-body' + (b.type === 'zone' ? ' sc-zone' : ''), tabindex: 0,
        role: 'button', 'aria-label': b.name, 'data-id': b.id }, bodiesG);
      g.style.color = b.color;
      var drift = el('g', { 'class': reduced ? '' : 'sc-drift' }, g);
      drift.style.animationDuration = (11 + (i % 7) * 2.5) + 's';
      drift.style.animationDelay = (-(i * 1.3) % 10) + 's';
      if (b.ring) {
        el('ellipse', { cx: b.x, cy: b.y, rx: b.r * 1.7, ry: b.r * 0.55, fill: 'none',
          stroke: b.color, 'stroke-width': 2.5, opacity: .5, transform: 'rotate(-18 ' + b.x + ' ' + b.y + ')' }, drift);
      }
      el('circle', { cx: b.x, cy: b.y, r: b.r + 7, 'class': 'sc-halo' }, drift);
      el('circle', { cx: b.x, cy: b.y, r: b.r, fill: b.color, 'class': 'core', opacity: .92 }, drift);
      el('circle', { cx: b.x - b.r * .3, cy: b.y - b.r * .3, r: b.r * .45, fill: '#ffffff', opacity: .14 }, drift);
      var lbl = el('text', { x: b.x, y: b.y + b.r + 16, 'class': b.type === 'zone' ? 'sc-zone-label' : 'sc-label' }, drift);
      lbl.textContent = b.name;
      g.addEventListener('mouseenter', function (ev) { showTip(b, ev); });
      g.addEventListener('mousemove', moveTip);
      g.addEventListener('mouseleave', hideTip);
      g.addEventListener('click', function () { selectBody(b.id, true); });
      g.addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); selectBody(b.id, true); } });
    });
  }

  function showTip(b, ev) {
    tip.textContent = b.name;
    tip.style.display = 'block';
    moveTip(ev);
  }
  function moveTip(ev) {
    if (!ev || ev.clientX === undefined) return;
    var r = svg.getBoundingClientRect();
    tip.style.left = Math.min(ev.clientX - r.left + 12, r.width - 140) + 'px';
    tip.style.top = (ev.clientY - r.top - 34) + 'px';
  }
  function hideTip() { tip.style.display = 'none'; }

  function allBodies() { return chart.planets.concat(chart.zones); }
  function bodyById(id) { return allBodies().filter(function (b) { return b.id === id; })[0]; }

  function selectBody(id, fly) {
    var b = bodyById(id);
    if (!b) return;
    hideTip();
    var items = zoneItems[id] || [];
    /* group items by note for cleaner display */
    var html = '<div class="sc-detail-card">' +
      '<button class="sc-detail-close" id="sc-detail-close" aria-label="Close">✕</button>' +
      '<h2 style="color:' + esc(b.color) + '">' + esc(b.name) + '</h2>' +
      '<p class="muted">' + esc(b.description) + '</p>';
    if (items.length) {
      html += '<h3>🎯 What farms here</h3><div class="sc-farm-list">' +
        items.slice(0, 30).map(function (it) {
          return '<div class="sc-farm-row"><b>' + esc(it.name) + '</b>' +
            (it.note ? '<span>' + esc(it.note) + '</span>' : '') + '</div>';
        }).join('') + '</div>' +
        (items.length > 30 ? '<p class="muted small">+' + (items.length - 30) + ' more — search them by name in the Vault.</p>' : '');
    } else {
      html += '<p class="muted">No mapped farm data for this location yet.</p>';
    }
    html += '</div>';
    showDetailOverlay(html);
    document.querySelectorAll('.sc-body').forEach(function (g) { g.classList.remove('active'); });
    var g = bodiesG.querySelector('[data-id="' + id + '"]');
    if (g) g.classList.add('active');
    if (fly) flyToPlanet(b);
  }

  /* cinematic zoom: center on the planet and zoom deep */
  function flyToPlanet(b) {
    var vw = 1200, vh = 800;
    var scale = 3.2; /* deep zoom on single planet */
    var tx = vw / 2 - b.x * scale, ty = vh / 2 - b.y * scale;
    camera.style.transform = 'translate(' + tx.toFixed(1) + 'px,' + ty.toFixed(1) + 'px) scale(' + scale.toFixed(3) + ')';
    document.getElementById('sc-hint').textContent = 'Tap ✕ or Reset to zoom back out';
  }

  /* floating detail overlay: bottom sheet on mobile, side panel on desktop */
  function showDetailOverlay(html) {
    var ov = document.getElementById('sc-overlay');
    if (!ov) {
      ov = document.createElement('div');
      ov.id = 'sc-overlay';
      ov.innerHTML = '<div class="sc-overlay-backdrop" id="sc-backdrop"></div><div class="sc-overlay-card" id="sc-overlay-card"></div>';
      document.querySelector('.sc-wrap').appendChild(ov);
      document.getElementById('sc-backdrop').addEventListener('click', hideDetailOverlay);
    }
    document.getElementById('sc-overlay-card').innerHTML = html;
    ov.classList.add('show');
    var close = document.getElementById('sc-detail-close');
    if (close) close.addEventListener('click', hideDetailOverlay);
  }
  function hideDetailOverlay() {
    var ov = document.getElementById('sc-overlay');
    if (ov) ov.classList.remove('show');
  }

  /* fly-to: pan + zoom the camera to frame the given zone ids */
  function flyTo(ids, isItem) {
    var pts = ids.map(bodyById).filter(Boolean);
    if (!pts.length) return;
    var xs = pts.map(function (p) { return p.x; }), ys = pts.map(function (p) { return p.y; });
    var minX = Math.min.apply(null, xs) - 90, maxX = Math.max.apply(null, xs) + 90;
    var minY = Math.min.apply(null, ys) - 90, maxY = Math.max.apply(null, ys) + 90;
    var vw = 1200, vh = 800;
    var scale = Math.min(vw / (maxX - minX), vh / (maxY - minY), 2.6);
    scale = Math.max(scale, 1);
    var cx = (minX + maxX) / 2, cy = (minY + maxY) / 2;
    var tx = vw / 2 - cx * scale, ty = vh / 2 - cy * scale;
    camera.style.transform = 'translate(' + tx.toFixed(1) + 'px,' + ty.toFixed(1) + 'px) scale(' + scale.toFixed(3) + ')';
    document.getElementById('sc-hint').textContent = isItem
      ? 'Showing farm locations — tap a pulsing planet for details'
      : 'Tap a planet or zone for details';
  }

  function resetView() {
    camera.style.transform = '';
    hideDetailOverlay();
    document.querySelectorAll('.sc-body').forEach(function (g) { g.classList.remove('target', 'active'); });
    document.getElementById('sc-hint').textContent = 'Tap a planet or zone for details';
    panel.innerHTML = '<p class="muted">Select a planet or zone to see what farms there.</p>';
  }
  document.getElementById('sc-reset').addEventListener('click', resetView);

  /* item farm search: type a mod/warframe/weapon, see where it drops */
  function setupItemSearch() {
    var input = document.getElementById('sc-item-input');
    var results = document.getElementById('sc-item-results');
    if (!input || !results || !itemPlanets) return;
    var names = Object.keys(itemPlanets);
    function zoneNames(zones) {
      return zones.map(function (z) {
        var b = bodyById(z);
        return b ? b.name : z;
      }).join(', ');
    }
    function doSearch() {
      var q = input.value.trim().toLowerCase();
      if (q.length < 2) { results.hidden = true; results.innerHTML = ''; return; }
      var matches = names.filter(function (n) {
        return n.toLowerCase().indexOf(q) !== -1;
      }).slice(0, 12);
      if (!matches.length) {
        results.innerHTML = '<div class="sc-item-result"><span>No matches — try a different name.</span></div>';
        results.hidden = false;
        return;
      }
      results.innerHTML = matches.map(function (name) {
        var e = itemPlanets[name];
        return '<div class="sc-item-result" data-name="' + esc(name) + '">' +
          '<b>' + esc(name) + '</b>' +
          '<span>' + esc(e.note || 'Farm location') + '</span>' +
          '<span class="sc-zones">📍 ' + esc(zoneNames(e.zones)) + '</span>' +
          '</div>';
      }).join('');
      results.hidden = false;
    }
    var debounce;
    input.addEventListener('input', function () {
      clearTimeout(debounce);
      debounce = setTimeout(doSearch, 200);
    });
    /* tap a result: highlight planets on the map and fly to them */
    results.addEventListener('click', function (e) {
      var row = e.target.closest('.sc-item-result');
      if (!row || !row.dataset.name) return;
      var name = row.dataset.name;
      var entry = itemPlanets[name];
      if (!entry) return;
      results.hidden = true;
      input.value = name;
      document.querySelectorAll('.sc-body').forEach(function (g) { g.classList.remove('target'); });
      entry.zones.forEach(function (z) {
        var g = bodiesG.querySelector('[data-id="' + z + '"]');
        if (g) g.classList.add('target');
      });
      document.getElementById('sc-hint').textContent = name + ' farms at: ' + entry.zones.map(function (z) {
        var b = bodyById(z); return b ? b.name : z;
      }).join(', ');
      flyTo(entry.zones, true);
    });
    /* hide results when tapping elsewhere */
    document.addEventListener('click', function (e) {
      if (!e.target.closest('.sc-item-search')) results.hidden = true;
    });
  }

  /* load data */
  Promise.all([
    window.TV.getJSON('data/site/starchart.json'),
    window.TV.getJSON('data/site/item-planets-0.json'),
    window.TV.getJSON('data/site/item-planets-1.json'),
    window.TV.getJSON('data/site/item-planets-2.json')
  ]).then(function (res) {
    chart = res[0];
    itemPlanets = Object.assign({}, res[1], res[2], res[3]);
    /* reverse index: zone -> items */
    Object.keys(itemPlanets).forEach(function (name) {
      var e = itemPlanets[name];
      e.zones.forEach(function (z) {
        (zoneItems[z] = zoneItems[z] || []).push({ name: name, note: e.note });
      });
    });
    buildChart();
    /* item farm search */
    setupItemSearch();
    /* item deep-link: ?item=Ash+Prime */
    var q = params();
    if (q.item) {
      if (itemPlanets[q.item]) {
        var entry = itemPlanets[q.item];
        entry.zones.forEach(function (z) {
          var g = bodiesG.querySelector('[data-id="' + z + '"]');
          if (g) g.classList.add('target');
        });
        document.title = q.item + ' — Star Chart — The Foundry';
        /* let the map render, then fly */
        setTimeout(function () { flyTo(entry.zones, true); }, reduced ? 0 : 350);
        /* auto-open the first zone's panel */
        setTimeout(function () { selectBody(entry.zones[0], false); }, reduced ? 60 : 1500);
      } else {
        /* item not in farm data — tell the user instead of silently doing nothing */
        document.getElementById('sc-hint').textContent = 'No farm data for "' + q.item + '" yet — try the search below';
        var si = document.getElementById('sc-item-input');
        if (si) { si.value = q.item; si.focus(); }
        panel.innerHTML = '<div class="notice">We don\'t have farm locations for <b>' + esc(q.item) + '</b> yet. ' +
          'Try searching for it below, or check the <a href="mods.html">Mods page</a> for its farm source.</div>';
      }
    }
  }).catch(function () {
    panel.innerHTML = '<div class="notice">Couldn\'t load the star chart data — this is usually a stale cache. <button class="btn small" onclick="window.TV.hardReload()">Tap to retry</button></div>';
  });

  document.getElementById('related').innerHTML = window.TV.relatedLinks('Keep going', [
    { label: 'Resource Finder', sub: 'Every material and where it drops', url: 'resources.html' },
    { label: 'Farming', sub: 'Where to farm anything', url: 'farming.html' },
    { label: 'Relics', sub: 'Prime parts from the Void', url: 'relics.html' }
  ]);
})();
</script>
</body>
</html>
